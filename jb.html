<!doctype html>
<html lang="ar" dir="rtl" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<title>عالم الالكترونيات | حالة التشغيل</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:#02060b;color:#fff}
body{min-height:100vh;position:relative;overflow:hidden}
body:before{content:"";position:fixed;inset:0;background:url("background.png") center/cover no-repeat;z-index:-3}
body:after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:-2}
#brand{position:fixed;top:0;left:0;right:0;z-index:5;text-align:center;padding:13px;background:rgba(2,8,15,.72);border-bottom:1px solid rgba(0,153,255,.35);backdrop-filter:blur(9px)}
#brand img{width:38px;height:38px;vertical-align:middle;border-radius:11px;margin-left:8px;box-shadow:0 0 20px rgba(0,150,255,.35)}
#brand b{font-size:22px;vertical-align:middle;text-shadow:0 0 14px rgba(0,145,255,.55)}
#statusCard{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(760px,90vw);padding:30px 24px;text-align:center;border-radius:24px;background:rgba(4,12,21,.86);border:1px solid rgba(40,164,255,.45);box-shadow:0 25px 90px rgba(0,0,0,.62),0 0 45px rgba(0,130,255,.14);z-index:3}
#icon{width:68px;height:68px;margin:0 auto 16px;border-radius:20px;display:grid;place-items:center;font-size:35px;background:rgba(0,119,255,.14);border:1px solid rgba(0,164,255,.38)}
#spin{width:50px;height:50px;margin:0 auto 18px;border:4px solid rgba(255,255,255,.13);border-top-color:#20a5ff;border-radius:50%;animation:spin .85s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#centerStatus{font-size:clamp(22px,4vw,31px);font-weight:800;line-height:1.35}
#centerDetail{margin-top:9px;font-size:13px;color:#9fb1c1;overflow-wrap:anywhere}
#bar{height:5px;width:min(470px,80%);margin:22px auto 0;border-radius:10px;overflow:hidden;background:#111c28}
#bar:after{content:"";display:block;width:38%;height:100%;background:#20a5ff;border-radius:10px;animation:load 1.25s ease-in-out infinite}
@keyframes load{0%{transform:translateX(280%)}100%{transform:translateX(-380%)}}
body.done #spin,body.done #bar{display:none}
body.done #statusCard{border-color:rgba(45,220,130,.55);box-shadow:0 25px 90px rgba(0,0,0,.62),0 0 45px rgba(20,220,120,.12)}
body.done #icon{background:rgba(25,190,105,.15);border-color:rgba(45,220,130,.45)}
body.done #centerStatus{color:#73f0ac}
body.fail #spin,body.fail #bar{display:none}
body.fail #statusCard{border-color:rgba(255,85,85,.60);box-shadow:0 25px 90px rgba(0,0,0,.62),0 0 45px rgba(255,60,60,.10)}
body.fail #icon{background:rgba(220,50,50,.14);border-color:rgba(255,90,90,.45)}
body.fail #centerStatus{color:#ff8d8d}
#restart{display:none;margin:20px auto 0;padding:11px 22px;border-radius:12px;background:#101c29;color:#fff;border:1px solid rgba(255,255,255,.18);font-size:15px}
body.fail #restart{display:inline-block}
#footer{position:fixed;bottom:13px;left:0;right:0;text-align:center;color:#91a3b5;font-size:12px;z-index:2}
#wrap{display:none}
body.log{overflow:auto}
body.log #statusCard{display:none}
body.log #wrap{display:block;padding:80px 18px 18px}
body.log #state{font-size:22px;font-weight:700;margin-bottom:8px}
body.log #out{white-space:pre-wrap;font:12px/1.45 Consolas,monospace;background:#0b1118;border:1px solid #203142;border-radius:12px;padding:12px;height:calc(100vh - 130px);overflow:auto}
.ok{color:#73f0ac}.bad{color:#ff8d8d}.warn{color:#ffd477}
</style>
</head>
<body>
<div id="brand"><img src="icon.png" alt="عالم الالكترونيات"><b>عالم الالكترونيات</b></div>

<div id="statusCard" aria-live="polite">
  <div id="icon">⚡</div>
  <div id="spin"></div>
  <div id="centerStatus">جاري تجهيز الملفات...</div>
  <div id="centerDetail">يرجى عدم إغلاق المتصفح أثناء العملية</div>
  <div id="bar"></div>
  <button id="restart" type="button">إعادة تحميل الصفحة</button>
</div>

<div id="footer">PS4 · Electronic World</div>
<div id="wrap">
  <div id="state"></div>
  <div id="out"></div>
</div>

<script type="module">
import "./jb.js?v=11";
</script>
<script>
document.getElementById("restart").addEventListener("click",function(){location.reload()});
</script>
</body>
</html>
